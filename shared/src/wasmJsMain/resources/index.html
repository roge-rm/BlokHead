<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BlokHead</title>
<link rel="icon" href="icon.png" type="image/png">
<style>
  html, body { margin: 0; height: 100%; background: #08090b; overflow: hidden; }
  canvas { touch-action: none; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #c8c8d0; font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 16px; }
  #loading { flex-direction: column; gap: 12px; }
  #loading img { width: 96px; height: 96px; border-radius: 22px; }
  #loading-bar { width: min(320px, 100%); height: 4px; border-radius: 2px; overflow: hidden; visibility: hidden; background: rgba(255, 255, 255, 0.12); }
  #loading-fill { width: 0; height: 100%; transition: width 0.2s; background: #a6efff; }
  #loading-amount { font-size: 13px; opacity: 0.7; font-variant-numeric: tabular-nums; min-height: 1.5em; }
</style>
<script>
  // How much of the download has come, while it comes: the app's WebAssembly
  // and scripts, against the sizes the build wrote beside the page
  // (load-sizes.json, shared/build.gradle.kts). The WebAssembly loaders ask
  // through fetch, so each answer is counted as it streams in on its way to
  // them; the app's script counts when it has loaded. The app removes
  // #loading when it starts.
  window.loadProgress = (() => {
    const seen = {};
    const finished = new Set();
    let sizes = null;
    let drawing = false;
    const mb = (n) => (n / 1048576).toFixed(1);
    const draw = () => {
      drawing = false;
      const text = document.getElementById('loading-text');
      if (!text) return;
      let have = 0, total = 0;
      if (sizes) {
        for (const [name, size] of Object.entries(sizes)) {
          total += size;
          have += finished.has(name) ? size : Math.min(seen[name] || 0, size);
        }
      } else {
        for (const name in seen) have += seen[name];
      }
      if (have === 0) return;
      const amount = document.getElementById('loading-amount');
      if (total > 0) {
        document.getElementById('loading-bar').style.visibility = 'visible';
        document.getElementById('loading-fill').style.width = (100 * have / total).toFixed(1) + '%';
        amount.textContent = have >= total ? mb(total) + ' MB' : mb(have) + ' of ' + mb(total) + ' MB';
        // All here: what is left is the browser compiling it, and the app starting.
        if (have >= total) text.textContent = 'Starting BlokHead…';
      } else {
        amount.textContent = mb(have) + ' MB';
      }
    };
    const redraw = () => { if (!drawing) { drawing = true; requestAnimationFrame(draw); } };
    const realFetch = window.fetch.bind(window);
    realFetch('load-sizes.json', { cache: 'no-cache' })
      .then((r) => (r.ok ? r.json() : null)).catch(() => null)
      .then((s) => { sizes = s; redraw(); });
    window.fetch = async (input, init) => {
      const response = await realFetch(input, init);
      const name = new URL(typeof input === 'string' ? input : (input.url || String(input)), location.href)
        .pathname.split('/').pop();
      if (!/\.(wasm|js)$/.test(name) || !response.ok || !response.body || finished.has(name)) return response;
      const counted = response.body.pipeThrough(new TransformStream({
        transform(chunk, out) {
          seen[name] = (seen[name] || 0) + chunk.byteLength;
          redraw();
          out.enqueue(chunk);
        },
        flush() {
          finished.add(name);
          redraw();
        },
      }));
      return new Response(counted, { status: response.status, statusText: response.statusText, headers: response.headers });
    };
    return { done(name) { finished.add(name); redraw(); } };
  })();
</script>
<script>
  // Sound effects for the Kotlin side (WebSfx calls blokSfx.play). Browsers only allow audio after
  // a user gesture, so the AudioContext starts on the first click/tap/key; the files are fetched
  // up front so the first sound isn't lost to a download.
  window.blokSfx = (() => {
    const names = ['move', 'rotate', 'lock', 'clear', 'gameover', 'menu'];
    const raw = {}, buffers = {};
    let ctx = null;
    for (const n of names) {
      raw[n] = fetch('sfx_' + n + '.wav').then(r => r.arrayBuffer()).catch(() => null);
    }
    function start() {
      if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        for (const n of names) {
          raw[n].then(b => b && ctx.decodeAudioData(b)).then(buf => { if (buf) buffers[n] = buf; }).catch(() => {});
        }
      }
      if (ctx.state === 'suspended') ctx.resume();
    }
    for (const type of ['pointerdown', 'keydown', 'touchstart']) {
      window.addEventListener(type, start, { capture: true });
    }
    return {
      play(n) {
        if (!ctx || !buffers[n]) return;
        const source = ctx.createBufferSource();
        source.buffer = buffers[n];
        source.connect(ctx.destination);
        source.start();
      },
    };
  })();
</script>
<script src="blokhead.js" defer onload="loadProgress.done('blokhead.js')"></script>
</head>
<body>
<div id="loading">
  <img src="icon.png" alt="">
  <div id="loading-text">Loading BlokHead…</div>
  <div id="loading-bar"><div id="loading-fill"></div></div>
  <div id="loading-amount"></div>
</div>
</body>
</html>
